# Test config for NVIDIA GPU display support
# Run from a beam checkout: ./target/release/beam-server --config config/beam-test-nvidia.toml
# (adjust web_root if your checkout isn't at the default relative path)

[server]
port = 9444
web_root = "./web/dist"

[video]
bitrate = 50000
framerate = 60
# encoder auto-detected (nvcudah264enc on NVIDIA)

[audio]
enabled = true

[session]
display_start = 20
max_sessions = 4
gpu_driver = "auto"
