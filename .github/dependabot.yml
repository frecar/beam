version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Include transitive deps so indirect-CVE drift gets auto-PRs rather than
    # waiting for a direct-dep bump to pull a newer version along.
    allow:
      - dependency-type: "all"
    groups:
      # Same reasoning as npm-major below. Exposure here is smaller: most of
      # these crates are 0.x, where a breaking bump is classified semver-MINOR
      # and so already rides in rust-minor alongside its siblings. This covers
      # the 1.0+ crates, and the 0.x families (axum/axum-extra, tower/tower-http,
      # rustls/tokio-rustls, gstreamer/gstreamer-*) once they reach 1.0.
      rust-major:
        patterns:
          - "*"
        update-types:
          - "major"
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(frontend)"
    allow:
      - dependency-type: "all"
    ignore:
      # typescript 7 (native compiler) is blocked upstream, not by our code:
      # @typescript-eslint/eslint-plugin's peer range does not yet admit TS 7,
      # so `npm install` fails ERESOLVE (see the closed PR bumping it). Hold the
      # major until the @typescript-eslint toolchain supports TS 7, then bump
      # typescript + @typescript-eslint together and REMOVE this ignore.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Majors go out as ONE PR, because npm peer families here are pinned to
      # each other exactly: @vitest/coverage-v8@N peers vitest@"N" -- a literal
      # version, not a range. A major split into one PR per package therefore
      # can never install: each half leaves its sibling behind and `npm install`
      # dies on ERESOLVE. That is not a rebaseable failure, it is arithmetic,
      # and it stranded two permanently-red PRs for the vitest 5 bump.
      #
      # Deliberately a catch-all rather than one group per known family. A
      # family list is a denylist that can only be populated by hitting the
      # deadlock once per family, and it still misses cross-family peers --
      # vitest peers `vite`, so a "vitest + @vitest/*" group would not have
      # covered the next instance of this exact bug.
      #
      # The cost -- one member's breakage reds the whole batch -- is bounded
      # here: /web has 14 dependencies, 13 of them dev, so a major batch is
      # realistically 1-3 packages. Reconsider if that stops being true.
      #
      # Listed before npm-minor because an update joins the FIRST group whose
      # patterns AND update-types both match. The two are disjoint today, so
      # order is not yet load-bearing; it stops a later widening of npm-minor
      # from silently swallowing majors.
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
