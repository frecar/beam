version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Include transitive deps so indirect-CVE drift gets auto-PRs rather than
    # waiting for a direct-dep bump to pull a newer version along.
    allow:
      - dependency-type: "all"
    groups:
      rust-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(frontend)"
    allow:
      - dependency-type: "all"
    ignore:
      # typescript 7 (native compiler) is blocked upstream, not by our code:
      # @typescript-eslint/eslint-plugin's peer range does not yet admit TS 7,
      # so `npm install` fails ERESOLVE (see the closed PR bumping it). Hold the
      # major until the @typescript-eslint toolchain supports TS 7, then bump
      # typescript + @typescript-eslint together and REMOVE this ignore.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
