name: Security audit
# managed-public-ci-template: cargo-audit — DO NOT HAND-EDIT.
# This file is a managed copy kept byte-identical to the canonical CI
# template. Hand-edits are overwritten by the next template sync; change
# the canonical template (and re-run the drift check) instead.
#
# cargo audit supply-chain sweep — scans Cargo.lock against the RustSec
# advisory DB. This repo ships a native binary (a .deb), not a container
# image, so its dependency-scan surface is the crate graph, not an OS
# image layer; cargo audit is the equivalent of the filesystem scan the
# container repos run.
#
# Triggers: every Cargo manifest/lock change (push + PR) so a dependency
# bump is gated, plus a weekly schedule so a newly-disclosed advisory
# against an unchanged Cargo.lock still surfaces (the whole point of
# supply-chain scanning).

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  # Run weekly so newly-disclosed advisories against an unchanged
  # Cargo.lock still surface (the whole point of supply-chain scanning).
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  security_audit:
    name: cargo audit
    # GitHub-hosted: pull_request-reachable on a public repo, so it must
    # not run fork code on a self-hosted runner. cargo audit only reads
    # Cargo.lock against the advisory DB — no infra dependency.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate Rust homes
        run: |
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUNNER_TEMP}/rustup" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        # SHA-pinned (supply-chain hardening): the `@stable` channel is moved to an explicit
        # `toolchain:` input so pinning the action to a SHA preserves behavior.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # No advisories are currently allowlisted. The former
          # RUSTSEC-2025-0040 ignore (the `users 0.10.0` crate, pulled in
          # transitively via `pam 0.8.0`) was dropped once `pam` was
          # replaced with `pam-client2`, which removes the `users`
          # dependency entirely.
          #
          # If a future advisory has no fixed upgrade available, add the ID
          # here with rationale and a re-evaluation trigger — and review on
          # every dependency bump.
