name: Strip closed-issue status label

# A closed issue must never carry an active status:* label
# (triage/ready/in-progress/blocked/burn-in) — a status-scoped search/filter
# should never surface a closed issue.
#
# Matches BY PREFIX on whatever status:* labels the closed issue actually
# carries, rather than a hardcoded list of canonical names — correct
# regardless of which subset of the taxonomy this repo has adopted, and
# self-adapting if that changes later. No checkout needed (GitHub API only).

on:
  issues:
    types: [closed]

permissions:
  issues: write

concurrency:
  group: strip-closed-status-label-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  strip-status-label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remove active status:* labels from the closed issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '.labels[].name')
          # `|| true`: no status:* label is the common case, not an error —
          # grep's no-match exit 1 would otherwise abort the run under
          # pipefail (verified: it does, on every closed issue with no
          # status label — the modal case, not an edge case).
          echo "$labels" | grep '^status:' | while IFS= read -r label; do
            [ -z "$label" ] && continue
            echo "Removing label: $label"
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$label"
          done || true
