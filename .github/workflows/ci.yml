name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Private reference check
        run: bash scripts/check-no-internal-refs.sh

      - name: LLM endpoint policy lint
        run: python3 scripts/check_no_external_llm.py

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  version-check:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify versions match
        run: make version-check

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Coverage subsumes the bare test run — vitest --coverage
      # executes every test and additionally gates on the
      # `lines` threshold in vite.config.ts (#45 ratchet protocol).
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Audit dependencies
        run: npm run audit

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          # Separate cache key from `check` — RUSTFLAGS=-C
          # instrument-coverage invalidates incremental builds, so
          # sharing the cache would cause full rebuilds on both sides.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-coverage-

      - name: Run coverage
        env:
          # Per-process .profraw filenames keep test crashes from
          # silently dropping coverage data — important for tests
          # that exercise GStreamer pipelines, which can abort.
          LLVM_PROFILE_FILE: beam-%p-%m.profraw
        run: |
          # Ratchet protocol: --fail-under-lines locks current
          # coverage as a floor. Baseline measured was 55.40%.
          # Several PRs lifted coverage in steady increments. This
          # PR (#45 big-lift-5) further refactors:
          # - agent/main.rs: extracts more pure helpers from
          #   build_input_callback (now_unix_millis, layout dedup,
          #   setxkbmap-result classifier, sched-fifo log message,
          #   capture-state transitions, frame_duration_ns_from_framerate,
          #   xrandr-resize log helpers, encoder-cooldown helpers,
          #   appsrc_queue_max_bytes, dispatch_resize/file_download,
          #   dispatch_capture_wake/update_last_input).
          # - agent/input.rs: scroll-button helpers (vertical/horizontal
          #   compute, deadzone check, evdev→x11 keycode).
          # - agent/display.rs: more pure path helpers (pulse_runtime_dir,
          #   xdg_runtime_dir, keyring paths, pulse_server_socket_url,
          #   browser→helper/desktop mappings, build_helpers_rc,
          #   build_mimeapps_list, parse_environ_for_dbus,
          #   systemd_user_bus_address).
          # - agent/signaling.rs: log-message helpers for the reconnect
          #   loop (connecting/closed/error/reconnecting/no_server_url).
          # - agent/cli.rs: extracts help_text + version_line.
          # - server/main.rs: extracts JWT/restore/admin/reaper log
          #   helpers, startup banner title, sigint/sigterm/shutdown
          #   messages, rate-limiter constants, agent-log retention
          #   constants, TLS handshake timeout constant, request_id_or_dash.
          # - server/signaling.rs: should_log_initial_video_frame,
          #   pong_timeout_elapsed, browser_replaced_message,
          #   invalid_browser_message_format.
          # Measured coverage rose to 86.53% regions / 85.99% lines.
          # Lines is the lower axis; floor(85.99 - 1) = 84.
          # --ignore-filename-regex 'tests?/' excludes the test harness
          # modules from the floor so it tracks real source coverage
          # only.
          cargo llvm-cov --workspace \
            --ignore-filename-regex 'tests?/' \
            --fail-under-lines 84
