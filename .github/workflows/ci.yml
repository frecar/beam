name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Private reference check
        run: bash scripts/check-no-internal-refs.sh

      - name: LLM endpoint policy lint
        run: python3 scripts/check_no_external_llm.py

      - name: Install system dependencies
        # xclip is needed for clipboard_bridge tests that exercise the
        # spawn path (with a bogus display so the binary returns an error
        # — never connecting to a real X server).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev \
            xclip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  version-check:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify versions match
        run: make version-check

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Coverage subsumes the bare test run — vitest --coverage
      # executes every test and additionally gates on the
      # `lines` threshold in vite.config.ts (#45 ratchet protocol).
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Audit dependencies
        run: npm run audit

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        # xclip is needed for clipboard_bridge tests that exercise the
        # spawn path (with a bogus display so the binary returns an error
        # — never connecting to a real X server).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev \
            xclip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          # Separate cache key from `check` — RUSTFLAGS=-C
          # instrument-coverage invalidates incremental builds, so
          # sharing the cache would cause full rebuilds on both sides.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-coverage-

      - name: Run coverage
        env:
          # Per-process .profraw filenames keep test crashes from
          # silently dropping coverage data — important for tests
          # that exercise GStreamer pipelines, which can abort.
          LLVM_PROFILE_FILE: beam-%p-%m.profraw
        run: |
          # Ratchet protocol: --fail-under-lines locks current
          # coverage as a floor. Baseline measured was 55.40%.
          # Several PRs lifted coverage in steady increments. This
          # PR (#45 big-lift-final) introduces trait-based injection
          # to test previously-untestable code paths, building on the
          # video::classify_idr_wait_step and signaling::classify_ws_incoming
          # extractions from the previous PR:
          # - agent/input.rs: Inject trait — input callback dispatch
          #   can now be exercised against a MockInjector instead of
          #   requiring a real X11 display.
          # - agent/clipboard.rs: ClipboardWrite + ClipboardRead
          #   traits — clipboard dispatch can be exercised against
          #   MockClipboard fakes.
          # - agent/filetransfer.rs: FileSink trait — file transfer
          #   dispatch can be exercised against MockFileSink fakes.
          # - agent/main.rs: build_input_callback closure body
          #   refactored into dispatch_input_action +
          #   spawn_setxkbmap_worker + handle_pre_dispatch helpers
          #   that take the new traits. 30+ new tests drive every
          #   InputAction variant + error branch.
          # - agent/display.rs: set_display_resolution refactored
          #   into XrandrOutcome + classification helpers
          #   (xrandr_probe_should_retry, xrandr_warn_line,
          #   xrandr_should_log_warn, xrandr_mode_set_failed_message).
          # - agent/cursor.rs: cursor_name_to_css /
          #   cursor_serial_changed / cursor_css_changed extracted
          #   from the X11-bound monitor loop.
          # - agent/clipboard_sync.rs: classify_clipboard_read_result
          #   + ClipboardSyncDispatch enum so the loop's branch tree
          #   is exercisable without a real ClipboardBridge.
          # - server/main.rs: TLS handshake / TCP accept / connection
          #   error / persist sessions / destroy session log
          #   helpers + classify_tls_handshake_result test helper.
          # Coverage rose to 87.62% lines / 87.80% regions.
          # Lines is the lower axis; floor(87.62 - 1) = 86.
          # The remaining I/O-bound gap (~7.4pp) is structural:
          # async fn main bodies, X11/PulseAudio/GStreamer-bound
          # functions that need a live runtime to exercise. The
          # trait infrastructure is in place so future PRs can add
          # mocks at the call sites that wrap the actual GStreamer
          # pipeline / screen capture / audio capture once those
          # are themselves refactored behind traits.
          # --ignore-filename-regex 'tests?/' excludes the test
          # harness modules from the floor so it tracks real source
          # coverage only.
          cargo llvm-cov --workspace \
            --ignore-filename-regex 'tests?/' \
            --fail-under-lines 86
