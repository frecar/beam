name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: every job in this workflow is read-only —
# checkout, cargo build/test/clippy/fmt, npm ci/test/build, version-check,
# and the hermetic Playwright smoke. None comment on PRs, push, or create
# releases, so the read-only default GITHUB_TOKEN needs no per-job
# escalation. Workflows that DO write (release, audit, dependabot
# auto-merge) carry their own narrower permissions blocks.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    # GitHub-hosted runner. This is a public repo: a fork PR can run
    # arbitrary code in CI, so every pull_request-reachable job runs on an
    # ephemeral GitHub-hosted runner rather than a self-hosted one. Only
    # release.yml (triggered solely by trusted tag pushes, never a fork PR)
    # stays self-hosted, where it needs the per-arch build + signing setup.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Private reference check
        run: bash scripts/check-no-internal-refs.sh

      - name: Non-public Git dependency check
        run: |
          python3 scripts/check_no_private_git_deps.py
          python3 scripts/check_no_private_git_deps.py --self-test

      - name: LLM endpoint policy lint
        run: python3 scripts/check_no_external_llm.py

      - name: Install system dependencies
        # xclip is needed for clipboard_bridge tests that exercise the
        # spawn path (with a bogus display so the binary returns an error
        # — never connecting to a real X server).
        run: |
          sudo flock /tmp/apt-ci.lock bash <<'APT'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev \
            xclip
          APT

      - name: Isolate Rust homes
        run: |
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUNNER_TEMP}/rustup" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        # SHA-pinned (supply-chain hardening): the `@stable` ref encodes the toolchain
        # channel, so pinning the action to a SHA requires moving the channel
        # into an explicit `toolchain:` input to preserve behavior.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry
            ${{ runner.temp }}/cargo/git
            target
          key: cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  version-check:
    name: Version consistency
    # GitHub-hosted — public-repo fork-PR isolation (see `check` above).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Verify versions match
        run: make version-check

  web:
    name: Web
    # GitHub-hosted — public-repo fork-PR isolation (see `check` above).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate npm cache
        run: |
          echo "npm_config_cache=${RUNNER_TEMP}/npm-cache" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/npm-cache"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Coverage subsumes the bare test run — vitest --coverage
      # executes every test and additionally gates on the
      # `lines` threshold in vite.config.ts (#45 ratchet protocol).
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Audit dependencies
        run: npm run audit

  web-e2e:
    name: Web E2E smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npm run test:e2e:install

      # The smoke suite builds the production bundle, serves it with vite
      # preview, and drives a chromium browser against it. Every backend /
      # external call is mocked via page.route, so the job is hermetic.
      - name: Browser smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  coverage:
    name: Coverage
    # GitHub-hosted — public-repo fork-PR isolation (see `check` above).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        # xclip is needed for clipboard_bridge tests that exercise the
        # spawn path (with a bogus display so the binary returns an error
        # — never connecting to a real X server).
        run: |
          sudo flock /tmp/apt-ci.lock bash <<'APT'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev \
            xclip
          APT

      - name: Isolate Rust homes
        run: |
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUNNER_TEMP}/rustup" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        # SHA-pinned (supply-chain hardening): channel moved to an explicit input — see above.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          # Separate cache key from `check` — RUSTFLAGS=-C
          # instrument-coverage invalidates incremental builds, so
          # sharing the cache would cause full rebuilds on both sides.
          path: |
            ${{ runner.temp }}/cargo/registry
            ${{ runner.temp }}/cargo/git
            target
          key: cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-coverage-

      - name: Run coverage
        # Single source of truth: the ratchet floor, the test-harness
        # exclude, and the LLVM_PROFILE_FILE crash-resilience pattern all
        # live in the Makefile's `coverage-rust` target (#45). Ratcheting
        # the floor is then a one-line Makefile change that applies
        # identically to local `make coverage-rust` and to this gate —
        # no duplicated number to drift out of sync (which is what left
        # the docs stale before this change).
        run: make coverage-rust

  gitleaks:
    # Server-side secret-scanning BACKSTOP to the local `gitleaks` pre-commit
    # hook. The local hook scans the STAGED diff at commit time but is
    # bypassable (`git commit --no-verify`, `SKIP=gitleaks`, commenting out the
    # hook); this job re-runs gitleaks on the PR so a bypassed local hook is
    # still caught before merge. It reuses the SAME vendored `.gitleaks.toml`
    # (no CI-vs-local divergence) and is wired into `ci-gate` below so a
    # detected secret blocks the merge.
    #
    # NOT path-filtered — it always runs, so it never reports `skipped` and is
    # safe in ci-gate's `needs` regardless of which files a PR touches.
    #
    # SCOPE = PR-diff range, not full-tree: the gate catches a NEWLY-introduced
    # secret. A pre-existing committed secret must be rotated, not turned into
    # an unrelated-PR blocker. A periodic full-history sweep is a separate
    # concern.
    #
    # IMPLEMENTATION = pinned CLI binary from GitHub Releases (version +
    # SHA256), NOT `gitleaks/gitleaks-action`: the Docker action pulls an image
    # (Docker-Hub pull-rate-limit pain) and trips org-license checks. The scan
    # itself is a local git op — no network once the binary is in place.
    #
    # GitHub-hosted — public-repo fork-PR isolation (see `check` above).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base commit is present for the range scan.
          fetch-depth: 0

      - name: Install pinned gitleaks
        # v8.30.1 matches the `gitleaks/gitleaks` `rev` pinned in
        # .pre-commit-config.yaml — keep the two in lockstep so CI == local.
        # When bumping the hook, bump GITLEAKS_VERSION + GITLEAKS_SHA256 here in
        # the same PR (SHA256 = linux_x64 tarball digest from checksums.txt).
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 3 -o "${tmp}/${tarball}" "${url}"
          echo "${GITLEAKS_SHA256}  ${tmp}/${tarball}" | sha256sum -c -
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" gitleaks
          install -m 0755 "${tmp}/gitleaks" "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
          rm -rf "${tmp}"

      - name: Scan PR diff for secrets
        # Range = base..head on pull_request, before..after on push to main.
        # Use head.sha (NOT github.sha, the synthetic merge commit on PR events)
        # so we scan exactly the contributor's commits. On a push whose `before`
        # is the zero-SHA (new branch / first push / force-push to an unknown
        # parent), fall back to scanning HEAD's working tree so the gate never
        # silently no-ops.
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          common=(--config .gitleaks.toml --redact --no-banner --verbose)
          if [ "${GH_EVENT}" = "pull_request" ]; then
            echo "Scanning PR range ${PR_BASE_SHA}..${PR_HEAD_SHA}"
            gitleaks git "${common[@]}" --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "${GH_EVENT}" = "push" ] && [ -n "${PUSH_BEFORE}" ] \
               && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            echo "Scanning push range ${PUSH_BEFORE}..${GITHUB_SHA}"
            gitleaks git "${common[@]}" --log-opts="${PUSH_BEFORE}..${GITHUB_SHA}"
          else
            echo "No usable base commit (new branch / first push); scanning working tree"
            gitleaks dir . "${common[@]}"
          fi

  agent-display-smoke:
    name: Agent display smoke
    # Boots beam-agent against a SIMULATED X display (Xvfb) and asserts it
    # captures + encodes real frames through the software (x264enc) GStreamer
    # pipeline. The crate's unit tests use trait-injected mocks, so this is
    # the only gate that exercises the runtime plugin set, the live X-server
    # capture path, and the startup deps (xclip) — the breakage classes a
    # mock can't reach. Software encode only (CI has no GPU); the NVENC/VA-API
    # paths and the full desktop-handoff round trip are out of scope here.
    #
    # GitHub-hosted — public-repo fork-PR isolation (see `check` above).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        # Build deps (pkg-config + GStreamer/Pulse/Opus/clang dev headers)
        # plus the RUNTIME surface the smoke needs:
        #   - xvfb          : the virtual X server beam-agent connects to
        #   - x11-utils      : xdpyinfo, to poll Xvfb readiness (not a sleep)
        #   - xclip          : ClipboardBridge::new aborts the agent without it
        #   - gstreamer1.0-plugins-{base,good,bad,ugly}: the loadable plugins
        #     for appsrc/appsink/videoconvert (base/good), h264parse (bad),
        #     and x264enc (ugly) — the software encode pipeline.
        #   - gstreamer1.0-tools: gst-inspect-1.0, for the pre-launch element
        #     check so a missing plugin fails loud rather than cryptically.
        run: |
          sudo flock /tmp/apt-ci.lock bash <<'APT'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev \
            xvfb x11-utils xclip \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools
          APT

      - name: Isolate Rust homes
        run: |
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUNNER_TEMP}/rustup" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        # SHA-pinned (supply-chain hardening): channel moved to an explicit input — see above.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry
            ${{ runner.temp }}/cargo/git
            target
          key: cargo-agent-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-agent-smoke-

      - name: Build beam-agent (release)
        run: cargo build --release --locked -p beam-agent

      - name: Run agent display smoke
        # The script starts Xvfb, waits for it via xdpyinfo, boots beam-agent
        # with software x264enc against a dead WS endpoint (the capture+encode
        # thread runs independently of the server connection), and asserts both
        # "First frame captured from X display" and "First H.264 frame from
        # encoder" appear within the timeout. It dumps the agent + Xvfb logs
        # and exits non-zero on any failure — no `|| true` masking.
        run: bash scripts/agent-display-smoke.sh

  post-deploy-smoke:
    name: Post-deploy smoke
    # Validates scripts/post-deploy-smoke.sh — the smoke a deployment tool
    # runs against an ALREADY-RUNNING instance after `apt install beam=X.Y.Z`.
    # It is the deploy-time counterpart to release.yml's package smoke: the
    # package smoke proves a freshly-built .deb boots in isolation; THIS smoke
    # proves the deploy took effect on a live host (right version serving,
    # service stays up, dashboard still renders). Here we boot a real
    # beam-server, point the smoke at it over the network, and assert both the
    # green path AND a failure path actually behaves — a smoke that cannot
    # fail proves nothing.
    #
    # GitHub-hosted — public-repo fork-PR isolation (see `check` above).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        # Build deps for beam-server, plus curl (the smoke's only runtime dep).
        run: |
          sudo flock /tmp/apt-ci.lock bash <<'APT'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev \
            curl
          APT

      - name: Isolate Rust homes
        run: |
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUNNER_TEMP}/rustup" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        # SHA-pinned (supply-chain hardening): channel moved to an explicit input — see above.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry
            ${{ runner.temp }}/cargo/git
            target
          key: cargo-postdeploy-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-postdeploy-smoke-

      - name: Build beam-server (release)
        run: cargo build --release --locked -p beam-server

      - name: Boot beam-server + run post-deploy smoke
        # Boot a REAL beam-server (lazy per-session agents → no display needed),
        # then exercise the live-instance smoke end-to-end. We assert the GREEN
        # path passes AND a deliberately wrong EXPECTED_VERSION fails — proving
        # the version-match guard (the post-deploy-specific assertion) actually
        # catches a "deploy didn't take effect" instance instead of rubber-
        # stamping it.
        run: |
          set -euo pipefail
          PORT=18444
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "beam-server version under test: ${VERSION}"

          # Minimal web_root with the SPA marker the smoke asserts. The full
          # bundle is validated by the `web` + `web-e2e` jobs; here we only
          # need the marker so the SPA-root check is meaningful.
          WEB_ROOT="${RUNNER_TEMP}/beam-web"
          mkdir -p "${WEB_ROOT}"
          printf '<!DOCTYPE html><html><head><title>Beam Remote Desktop</title></head><body><div id="app"></div></body></html>\n' \
            > "${WEB_ROOT}/index.html"

          CONFIG="${RUNNER_TEMP}/beam.toml"
          cat > "${CONFIG}" <<EOF
          [server]
          bind = "127.0.0.1"
          port = ${PORT}
          web_root = "${WEB_ROOT}"

          [session]
          gpu_driver = "dummy"
          EOF

          # beam-server persists state under /var/lib/beam; create it writable.
          sudo mkdir -p /var/lib/beam
          sudo chown "$(id -u):$(id -g)" /var/lib/beam

          ./target/release/beam-server --config "${CONFIG}" --port "${PORT}" \
            > "${RUNNER_TEMP}/beam-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          BASE="https://127.0.0.1:${PORT}"

          echo "::group::green path (correct version + marker must PASS)"
          BEAM_SMOKE_SETTLE=2 bash scripts/post-deploy-smoke.sh "${BASE}" "${VERSION}"
          echo "::endgroup::"

          echo "::group::failure path (wrong version must FAIL)"
          if BEAM_SMOKE_SETTLE=2 bash scripts/post-deploy-smoke.sh "${BASE}" "0.0.0-not-deployed"; then
            echo "::error::post-deploy-smoke PASSED on a version mismatch — the guard is broken"
            cat "${RUNNER_TEMP}/beam-server.log"
            exit 1
          fi
          echo "version-mismatch correctly rejected"
          echo "::endgroup::"

  capture-readiness-smoke:
    name: Capture readiness smoke
    # Validates `beam-doctor --capture` — the host-local capture-readiness gate
    # a deployment tool runs on each host after the network post-deploy smoke.
    #
    # The network smoke proves beam-server is up and serving the right version,
    # but the server only relays frames — it never links GStreamer. Whether a
    # session would actually produce a picture depends on the host's capture
    # stack (GStreamer plugins, an H.264 encoder element, the Xorg dummy
    # driver), which an HTTP probe cannot see. `beam-doctor --capture` checks
    # exactly that drift class on the host and exits non-zero if the stack is
    # broken. This job proves the gate behaves on BOTH paths — a gate that
    # cannot fail proves nothing:
    #   - ready path:    full plugin set installed → exit 0.
    #   - degraded path: encoder hidden from PATH   → exit non-zero.
    #
    # No Rust build, no GPU, no live session — this is a pure shell-script gate,
    # so it is cheap and deterministic. (NVENC/VA-API and the live capture
    # round-trip are exercised by `agent-display-smoke`; this job is only about
    # the readiness gate's contract.)
    #
    # GitHub-hosted — public-repo fork-PR isolation (see `check` above).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install capture stack
        # The runtime capture surface beam-doctor --capture inspects:
        #   - gstreamer1.0-tools: gst-inspect-1.0 (the encoder/element probe)
        #   - plugins-{base,good,bad,ugly}: appsrc/appsink, ximagesrc,
        #     h264parse, x264enc — the software capture+encode element set
        #   - xserver-xorg-core + video-dummy: Xorg + the dummy driver beam
        #     uses for headless virtual displays
        #   - x11-xserver-utils (xrandr), xclip, x11-xkb-utils (setxkbmap)
        run: |
          sudo flock /tmp/apt-ci.lock bash <<'APT'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            xserver-xorg-core xserver-xorg-video-dummy \
            x11-xserver-utils xclip x11-xkb-utils
          APT

      - name: Ready path — capture stack present must PASS
        # Xwrapper.config is absent on the runner, so beam-doctor would FAIL the
        # "allows non-console users" check. Provision it (mirrors what the .deb
        # postinstall does on a real host) so the ready path reflects a properly
        # installed host, not a half-configured runner.
        run: |
          set -euo pipefail
          echo 'allowed_users=anybody' | sudo tee /etc/X11/Xwrapper.config >/dev/null
          echo "::group::beam-doctor --capture (ready)"
          bash scripts/beam-doctor --capture
          echo "::endgroup::"
          echo "ready path passed (exit 0)"

      - name: Degraded path — encoder missing must FAIL
        # Hide gst-inspect-1.0 (and the rest of the capture binaries) from PATH
        # to simulate post-upgrade plugin drift. The gate MUST exit non-zero;
        # if it passes, the "capture ready" signal is meaningless.
        run: |
          set -euo pipefail
          STRIP="${RUNNER_TEMP}/nogst-bin"
          mkdir -p "${STRIP}"
          for b in bash cat grep awk sed cut head printf command id find ss systemctl mktemp tee uname; do
            src="$(command -v "$b" || true)"
            [ -n "${src}" ] && ln -sf "${src}" "${STRIP}/${b}"
          done
          echo "::group::beam-doctor --capture (degraded — encoder hidden)"
          if PATH="${STRIP}" bash scripts/beam-doctor --capture; then
            echo "::error::beam-doctor --capture PASSED with the capture stack hidden — the gate is broken"
            exit 1
          fi
          echo "::endgroup::"
          echo "degraded path correctly failed (non-zero exit)"

  ci-gate:
    # Single aggregate status check. Point branch protection at "CI Gate"
    # instead of each individual job so new jobs become gating
    # automatically and a re-run that cancels/skips a required job can't
    # slip through.
    #
    # `if: ${{ !cancelled() }}` keeps THIS job running even when an
    # upstream job was cancelled or skipped — without it, a cancelled
    # upstream would mark ci-gate "skipped" and a "skipped" required
    # check counts as passing in branch protection (the exact blind spot
    # this gate exists to close). The step below then reds the gate on
    # ANY non-success upstream result: `failure`, `cancelled`, OR
    # `skipped`. None of this workflow's jobs are conditionally skipped
    # by design, so a `skipped` here always means infra trouble and
    # should fail closed.
    name: CI Gate
    needs: [check, version-check, web, web-e2e, coverage, gitleaks, agent-display-smoke, post-deploy-smoke, capture-readiness-smoke]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() }}
    steps:
      - name: Assert all required jobs succeeded
        if: >-
          ${{ contains(needs.*.result, 'failure')
              || contains(needs.*.result, 'cancelled')
              || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required CI job did not succeed:"
          echo "  check          = ${{ needs.check.result }}"
          echo "  version-check  = ${{ needs.version-check.result }}"
          echo "  web            = ${{ needs.web.result }}"
          echo "  web-e2e        = ${{ needs.web-e2e.result }}"
          echo "  coverage       = ${{ needs.coverage.result }}"
          echo "  gitleaks       = ${{ needs.gitleaks.result }}"
          echo "  agent-display-smoke = ${{ needs.agent-display-smoke.result }}"
          echo "  post-deploy-smoke   = ${{ needs.post-deploy-smoke.result }}"
          echo "  capture-readiness-smoke = ${{ needs.capture-readiness-smoke.result }}"
          exit 1
