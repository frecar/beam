name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Private reference check
        run: bash scripts/check-no-internal-refs.sh

      - name: LLM endpoint policy lint
        run: python3 scripts/check_no_external_llm.py

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-check-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  version-check:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify versions match
        run: make version-check

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Coverage subsumes the bare test run — vitest --coverage
      # executes every test and additionally gates on the
      # `lines` threshold in vite.config.ts (#45 ratchet protocol).
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Audit dependencies
        run: npm run audit

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          # Separate cache key from `check` — RUSTFLAGS=-C
          # instrument-coverage invalidates incremental builds, so
          # sharing the cache would cause full rebuilds on both sides.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-coverage-

      - name: Run coverage
        env:
          # Per-process .profraw filenames keep test crashes from
          # silently dropping coverage data — important for tests
          # that exercise GStreamer pipelines, which can abort.
          LLVM_PROFILE_FILE: beam-%p-%m.profraw
        run: |
          # Ratchet protocol: --fail-under-lines locks current
          # coverage as a floor. Baseline measured was 55.40%.
          # Several PRs lifted coverage in steady increments. This
          # PR (#45 big-lift-4) refactors:
          # - agent/main.rs: extracts an InputAction enum + a pure
          #   classify_input_event so the input-dispatch decisions can
          #   be tested without X11; adds handle_visibility_change
          #   (channel + AtomicBool side effects), audio retry backoff
          #   math, capture-error logging predicates, encoder reset
          #   cooldown, idle-state + framerate selectors, resize-noop
          #   check, home_dir + output_name resolvers, and cursor
          #   message builder.
          # - agent/display.rs: extracts parse_xrandr_connected_output,
          #   is_benign_xrandr_stderr, resolve_xorg_invocation,
          #   xorg_config_needs_cleanup; adds tests for pa_config,
          #   generate_nvidia_xorg_config, try_persistent_config_in,
          #   seed_default_config, is_snap_binary, which_exists,
          #   is_display_running, find_non_snap_app.
          # - server/main.rs: extracts resolve_jwt_secret with a
          #   JwtSecretSource enum + count_validation_severities,
          #   pam_missing_warning, web_root_is_usable,
          #   web_root_missing_warning, startup_banner_line.
          # Measured coverage rose to 85.57% regions / 84.79% lines.
          # Lines is the lower axis; floor(84.79 - 1) = 83.
          # --ignore-filename-regex 'tests?/' excludes the test harness
          # modules from the floor so it tracks real source coverage
          # only.
          cargo llvm-cov --workspace \
            --ignore-filename-regex 'tests?/' \
            --fail-under-lines 83
