name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Verify version consistency
    runs-on: [self-hosted, Linux, X64, cluster-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract and compare versions
        run: |
          CARGO_VERSION=$(grep -A5 '\[workspace.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
          NPM_VERSION=$(node -p "require('./web/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Cargo.toml version: ${CARGO_VERSION}"
          echo "package.json version: ${NPM_VERSION}"
          echo "Git tag version: ${TAG_VERSION}"

          MISMATCH=0
          if [ "${CARGO_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match git tag (${TAG_VERSION})"
            MISMATCH=1
          fi
          if [ "${NPM_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::package.json version (${NPM_VERSION}) does not match git tag (${TAG_VERSION})"
            MISMATCH=1
          fi
          if [ "${CARGO_VERSION}" != "${NPM_VERSION}" ]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match package.json version (${NPM_VERSION})"
            MISMATCH=1
          fi
          if [ "${MISMATCH}" -eq 1 ]; then
            echo "::error::Version mismatch detected. All versions must match: Cargo.toml, package.json, and git tag."
            exit 1
          fi
          echo "All versions match: ${CARGO_VERSION}"

  build-web:
    name: Build web client
    needs: [version-check]
    runs-on: [self-hosted, Linux, X64, cluster-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Isolate npm cache
        run: |
          echo "npm_config_cache=${RUNNER_TEMP}/npm-cache" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/npm-cache"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web client
        # SENTRY_AUTH_TOKEN/SENTRY_ORG/SENTRY_PROJECT gate the sentry-cli
        # sourcemap upload in web/vite.config.ts (sentryUploadEnabled) — the
        # plugin also deletes the uploaded .map files immediately after
        # upload (filesToDeleteAfterUpload), so web/dist/ is already clean
        # by the time this job's artifact is uploaded below. Both downstream
        # consumers of that artifact (package-deb's .deb and package's public
        # release tarball) therefore never see a sourcemap — stripped once,
        # at the source, not per-consumer.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.ref_name }}
        run: cd web && npm ci && npm run build

      - name: Verify no sourcemaps in the build output
        # Regression guard for the strip-at-source step above: if
        # filesToDeleteAfterUpload ever stops matching (glob typo, plugin
        # config drift, upload disabled so the plugin never runs at all),
        # this fails loud here instead of silently shipping .map files in
        # the public .deb / release tarball later.
        run: |
          set -euo pipefail
          if find web/dist -name '*.map' | grep -q .; then
            echo "::error::Sourcemap (.map) files present in web/dist — must not ship publicly"
            find web/dist -name '*.map'
            exit 1
          fi
          echo "No .map files in web/dist — OK"

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: web/dist/

  build-binary:
    name: Build ${{ matrix.target }}
    needs: [version-check]
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}", cluster-ci]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner_arch: X64
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner_arch: ARM64
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo flock /tmp/apt-ci.lock bash <<'APT'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxcb-xfixes0-dev \
            libpulse-dev libopus-dev \
            libpam0g-dev libclang-dev
          APT

      - name: Isolate Rust homes
        run: |
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUNNER_TEMP}/rustup" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        # SHA-pinned (supply-chain hardening): the `@stable` channel is moved to an explicit
        # `toolchain:` input so pinning the action to a SHA preserves behavior.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry
            ${{ runner.temp }}/cargo/git
            target
          key: cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.target }}-

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            target/release/beam-server
            target/release/beam-agent

  package-deb:
    name: Package .deb (${{ matrix.arch }})
    needs: [build-web, build-binary]
    runs-on: [self-hosted, Linux, X64, cluster-ci]
    strategy:
      matrix:
        include:
          - arch: amd64
            artifact_arch: x86_64
          - arch: arm64
            artifact_arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download web dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: web-dist

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binaries-${{ matrix.artifact_arch }}
          path: binaries-${{ matrix.artifact_arch }}

      - name: Create staging directory
        run: |
          mkdir -p staging/usr/local/bin staging/usr/share/beam/web/dist
          cp binaries-${{ matrix.artifact_arch }}/beam-server staging/usr/local/bin/
          cp binaries-${{ matrix.artifact_arch }}/beam-agent staging/usr/local/bin/
          cp scripts/beam-doctor staging/usr/local/bin/
          chmod 755 staging/usr/local/bin/*
          cp -r web-dist/* staging/usr/share/beam/web/dist/

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq && sudo apt-get install -y nfpm

      - name: Build .deb package
        run: |
          VERSION=$(grep -A5 '\[workspace.package\]' Cargo.toml | grep '^version' | sed 's/.*"\(.*\)"/\1/')
          export VERSION
          export ARCH="${{ matrix.arch }}"
          nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target "beam_${VERSION}_${ARCH}.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb-${{ matrix.arch }}
          path: beam_*.deb

  test-package:
    name: Test .deb (${{ matrix.arch }})
    needs: [package-deb]
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}", cluster-ci]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner_arch: X64
          - arch: arm64
            runner_arch: ARM64
    steps:
      # Checkout is required so the runtime smoke script (scripts/package-smoke.sh)
      # is available to mount into the install container.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download .deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deb-${{ matrix.arch }}
          path: debs

      - name: Test .deb install in Docker
        # Install the .deb in a clean ubuntu:24.04, verify the static
        # packaging contract (binaries on PATH, web assets present), then
        # run a RUNTIME smoke: boot beam-server and assert /api/health and
        # the SPA root actually respond. A separate strict `bash -c` per
        # check (no `&& ... || true` chain) so a failure can't be masked.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$(pwd)/debs:/debs:ro" \
            -v "$(pwd)/scripts/package-smoke.sh:/usr/local/bin/package-smoke.sh:ro" \
            ubuntu:24.04 bash -euo pipefail -c '
              apt-get update -qq
              # curl is required by the runtime smoke and is not in the base image.
              dpkg -i /debs/beam_*_'"${{ matrix.arch }}"'.deb \
                || { apt-get install -f -y -qq; }
              apt-get install -y -qq curl

              # Static packaging contract.
              beam-server --version
              beam-doctor --help || true
              test -f /usr/share/beam/web/dist/index.html
              ls /usr/share/beam/web/dist/assets/*.js >/dev/null 2>&1
              echo "Static web assets verified OK"

              # Runtime smoke: server boots + serves HTTP surface.
              bash /usr/local/bin/package-smoke.sh
            '

  publish-apt:
    name: Publish APT repository
    needs: [test-package]
    runs-on: [self-hosted, Linux, X64, cluster-ci]
    if: success()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download .deb (amd64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deb-amd64
          path: deb-amd64

      - name: Download .deb (arm64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deb-arm64
          path: deb-arm64

      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y dpkg-dev

      - name: Import GPG key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-keys --with-colons | grep '^pub' | head -1 | cut -d: -f5)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> "$GITHUB_ENV"

      - name: Prepare APT repository
        run: |
          mkdir -p apt-repo/pool/main/b/beam apt-repo/gpg
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          mkdir -p apt-repo/dists/stable/main/binary-arm64
          cp deb-amd64/*.deb deb-arm64/*.deb apt-repo/pool/main/b/beam/

          cd apt-repo

          # Generate per-architecture package indices
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages

          dpkg-scanpackages --arch arm64 pool/ > dists/stable/main/binary-arm64/Packages
          gzip -k dists/stable/main/binary-arm64/Packages

          # Generate Release file with architecture info
          cd dists/stable
          apt-ftparchive -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Suite="stable" \
            release . > Release
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --armor --clearsign --output InRelease Release

          cd ../..

          # Export public key
          gpg --armor --export "${GPG_KEY_ID}" > gpg/beam.gpg

      - name: Copy landing page
        run: cp packaging/index.html apt-repo/index.html

      - name: Finalize repository
        run: |
          cp packaging/install-beam.sh apt-repo/install || true
          touch apt-repo/.nojekyll

      - name: Deploy to gh-pages
        run: |
          cd apt-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Update APT repository - ${GITHUB_REF_NAME}"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --force origin gh-pages

  package:
    name: Create release
    needs: [build-web, build-binary, test-package]
    runs-on: [self-hosted, Linux, X64, cluster-ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Package tarballs
        run: |
          VERSION="${GITHUB_REF_NAME}"
          for arch in x86_64 aarch64; do
            DIR="beam-${VERSION}-linux-${arch}"
            mkdir -p "${DIR}/bin" "${DIR}/web/dist"

            cp "binaries-${arch}/beam-server" "${DIR}/bin/"
            cp "binaries-${arch}/beam-agent" "${DIR}/bin/"
            chmod 755 "${DIR}/bin/"*

            cp -r web-dist/* "${DIR}/web/dist/"
            cp config/beam.toml "${DIR}/"
            cp systemd/beam.service "${DIR}/"
            cp scripts/install.sh "${DIR}/"
            cp LICENSE "${DIR}/" 2>/dev/null || true
            cp README.md "${DIR}/" 2>/dev/null || true

            tar czf "${DIR}.tar.gz" "${DIR}"
            sha256sum "${DIR}.tar.gz" >> checksums.txt
          done

      - name: Add .deb checksums
        run: |
          sha256sum deb-amd64/*.deb >> checksums.txt
          sha256sum deb-arm64/*.deb >> checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            beam-*.tar.gz
            deb-amd64/*.deb
            deb-arm64/*.deb
            checksums.txt
