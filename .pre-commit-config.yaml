default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # Secret-scanning gate. Runs `gitleaks git --pre-commit --redact --staged`
  # over the STAGED diff on every commit and blocks when a credential is
  # detected — prevention against accidentally committing a real secret.
  # Tuning + the known-safe fixture allowlist live in `.gitleaks.toml`
  # (`[extend] useDefault = true`). `language: golang` — pre-commit
  # auto-bootstraps Go, so no host toolchain is required. Stacks with the
  # weaker `detect-private-key` hook above (PEM-only).
  # NEVER bypass with `git commit --no-verify` or `SKIP=gitleaks`.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: conventional-commit
        name: Check conventional commit format
        entry: >-
          bash -c 'MSG=$(head -1 "$1");
          if echo "$MSG" | grep -qE "^release:"; then exit 0; fi;
          if echo "$MSG" | grep -qE "^Merge "; then exit 0; fi;
          if ! echo "$MSG" | grep -qE "^(feat|fix|refactor|chore|docs|test|ci|perf|style|build|revert|deps)(\(.+\))?(!)?:"; then
          echo "Commit message must use conventional commit format";
          echo "  Valid: feat:, fix:, refactor:, chore:, docs:, test:, ci:, perf:, build:, revert:, deps:";
          echo "  Got: $MSG"; exit 1; fi' --
        language: system
        always_run: true
        stages: [commit-msg]

      - id: strip-co-author
        name: Strip Co-Authored-By lines
        entry: bash -c 'sed -i "/^Co-Authored-By:/d" "$1"' --
        language: system
        always_run: true
        stages: [commit-msg]

      - id: no-external-llm
        name: "Configured LLM endpoint check"  # llm-policy: ignore
        entry: python3 scripts/check_no_external_llm.py
        language: system
        pass_filenames: true
        stages: [pre-commit]

      - id: no-private-refs
        name: Private reference check
        entry: bash scripts/check-no-internal-refs.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]

      - id: no-private-git-deps
        name: Non-public Git dependency check
        entry: python3 scripts/check_no_private_git_deps.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # >>> shared baseline additions (managed; do not hand-edit) >>>
  # Lint GitHub Actions workflow YAML locally. `language: golang` auto-bootstraps
  # Go, so no host toolchain is needed. Keep this `rev` and the CI `actionlint`
  # job's pinned version in lockstep.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint

  # Spell-checker (crate-ci/typos). Allowlist of domain vocabulary lives in
  # `.typos.toml` — add a word there ONLY for a real domain term, never to paper
  # over a misspelling. Keep this `rev` and CI's `typos` job in lockstep.
  #
  # `args` overrides the upstream default `[--write-changes, --force-exclude]`:
  # we DROP `--write-changes` so the hook is CHECK-ONLY and can never auto-fix.
  # Auto-fix silently rewrites source — and for a localized repo it corrupts
  # non-English UI strings into broken English. We KEEP
  # `--force-exclude` so a repo's `.typos.toml` `[files] extend-exclude` is
  # honoured even when pre-commit passes explicit filenames (without it, an
  # explicitly-passed excluded file is scanned anyway). Check-only is the right
  # default for every consumer; a repo that genuinely wants auto-fix overrides
  # this hook OUTSIDE the managed block.
  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos
        args: ["--force-exclude"]

  # Lint standalone shell scripts on the host shellcheck binary — NOT the
  # Docker-image hook, to dodge Docker-Hub rate-limits on shared NAT egress.
  # `language: system` calls the on-PATH shellcheck directly.
  - repo: local
    hooks:
      - id: shellcheck
        name: "ShellCheck — host binary lints shell scripts"
        entry: shellcheck
        language: system
        types: [shell]
        # shellcheck has no zsh dialect ("Unknown shell: zsh").
        exclude: \.zsh$
  # <<< shared baseline additions <<<
