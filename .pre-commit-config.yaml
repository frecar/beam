repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: local
    hooks:
      - id: conventional-commit
        name: Check conventional commit format
        entry: >-
          bash -c 'MSG=$(head -1 "$1");
          if echo "$MSG" | grep -qE "^release:"; then exit 0; fi;
          if echo "$MSG" | grep -qE "^Merge "; then exit 0; fi;
          if ! echo "$MSG" | grep -qE "^(feat|fix|refactor|chore|docs|test|ci|perf|style|build|revert|deps)(\(.+\))?(!)?:"; then
          echo "Commit message must use conventional commit format";
          echo "  Valid: feat:, fix:, refactor:, chore:, docs:, test:, ci:, perf:, build:, revert:, deps:";
          echo "  Got: $MSG"; exit 1; fi' --
        language: system
        always_run: true
        stages: [commit-msg]

      - id: strip-co-author
        name: Strip Co-Authored-By lines
        entry: bash -c 'sed -i "/^Co-Authored-By:/d" "$1"' --
        language: system
        always_run: true
        stages: [commit-msg]

      - id: no-external-llm
        name: "Configured LLM endpoint check"  # llm-policy: ignore
        entry: python3 scripts/check_no_external_llm.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
