[workspace]
members = ["crates/server", "crates/agent", "crates/protocol"]
resolver = "2"

[workspace.package]
version = "0.3.25"
edition = "2024"
license = "MIT"
authors = ["Beam Contributors"]
repository = "https://github.com/frecar/beam"

[workspace.dependencies]
# Shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1.1"

# Protocol
beam-protocol = { path = "crates/protocol" }

# Web framework
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "cors", "trace", "limit", "request-id", "uuid"] }

# TLS
rustls = { version = "0.23.40", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rcgen = "0.14.8"
tokio-rustls = "0.26.4"

# HTTP internals
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto"] }

# Auth
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
pam-client2 = "0.5"

# GStreamer
gstreamer = "0.25.2"
gstreamer-app = { version = "0.25", features = ["v1_24"] }
gstreamer-video = "0.25"

# X11
x11rb = { version = "0.14.0", features = ["shm", "randr", "xfixes", "xtest", "allow-unsafe-code"] }

# Input
nix = { version = "0.31.3", features = ["ioctl", "fs", "process", "signal", "user"] }

# Audio
libpulse-binding = "2"
libpulse-simple-binding = "2"
# opus2 is a maintained safe libopus wrapper (same API as the old `audiopus`
# crate). Its `libopus_sys` backend probes for the system libopus via
# pkg-config first, so it links `libopus-dev` and avoids the unmaintained
# `audiopus_sys` (RUSTSEC-2026-0150) and any vendored CMake build.
# Pinned to 0.3 to avoid 0.4's extra pure-Rust backend dependency.
opus2 = "0.4"
